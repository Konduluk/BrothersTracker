name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: brothers_tracker_release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BrothersTracker --collect-all playwright app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BrothersTracker-Windows
          path: brothers_tracker_release/dist/BrothersTracker.exe
